<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GitHub Repositories</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">GitHub Repository Search</h1>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <form id="github-form">
          <label for="username" class="form-label">GitHub username</label>
          <div class="input-group">
            <input id="username" type="text" class="form-control"
                   placeholder="e.g. octocat" required>
            <button class="btn btn-primary" type="submit">Search</button>
          </div>
        </form>
        <div id="message" class="mt-3"></div>
      </div>
    </div>

    <div id="user-info" class="mb-3"></div>

    <div class="table-responsive">
      <table id="repo-table" class="table table-striped table-hover d-none">
        <thead class="table-dark">
          <tr>
            <th>Name</th>
            <th>Description</th>
            <th>Followers</th>
          </tr>
        </thead>
        <tbody id="repo-body"></tbody>
      </table>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
